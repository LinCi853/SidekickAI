[workspace]

[package]
name = "sidekickai-uninstaller"
version = "1.1.0"
description = "SidekickAI standalone uninstaller"
authors = ["SidekickAI"]
edition = "2021"
publish = false

[lib]
name = "sidekickai_uninstaller_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
sidekickai-uninstall-core = { path = "../../installer-shared/uninstall-core" }
sidekickai-uninstall-host = { path = "../../installer-shared/uninstall-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
