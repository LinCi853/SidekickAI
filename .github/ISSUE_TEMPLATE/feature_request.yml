name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明**要解决的问题**，而不是直接给出实现方案——方案可以讨论，问题必须成立。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      description: 现在的使用体验哪里不够好
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么改
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 以及为什么它们不够好
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围（如了解）
      options:
        - label: 主进程 / 系统能力
        - label: 渲染层界面
        - label: 安装器 / 打包发布
        - label: 文档
