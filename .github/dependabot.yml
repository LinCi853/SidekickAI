# 依赖自动更新
# 渲染层依赖放在 devDependencies，因此两组都要覆盖
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 次要/补丁更新合并为一个 PR，避免刷屏
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Electron 大版本升级需人工评估（原生模块 ABI 变更）
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
      # TypeScript 7 移除 baseUrl 并禁止非相对 paths，需专门迁移评估
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # plugin-react 6 要求 vite 6+，需与 vite/electron-vite/vitest 一并评估
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # file-uri-to-path 是 better-sqlite3 在 asar 内解析原生模块路径的运行时依赖，
      # CI（--ignore-scripts）覆盖不到该路径，major 升级须本地 test:desktop 验证
      - dependency-name: file-uri-to-path
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
