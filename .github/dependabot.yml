# 依赖自动更新
# 渲染层依赖放在 devDependencies，因此两组都要覆盖
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 次要/补丁更新合并为一个 PR，避免刷屏
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Electron 大版本升级需人工评估（原生模块 ABI 变更）
      - dependency-name: electron
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /installer-tauri/src-tauri
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
