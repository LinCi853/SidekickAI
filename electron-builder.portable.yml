appId: com.sidekickai.app
productName: SidekickAI
directories:
  buildResources: resources
  output: dist-portable
files:
  - out/**/*
  - resources/icons/*
  # 原生模块显式打包（避免被 electron-builder 自动剔除规则误删）
  - node_modules/better-sqlite3/build/Release/better_sqlite3.node
  # 仅打包 Windows 预编译（剔除 darwin / linux 平台 .node，节省 ~2 MB）
  - node_modules/uiohook-napi/prebuilds/win32-*/**
  # 删除 Chromium 协议汇总文件（10MB+，用户可在线查阅）
  - '!LICENSES.chromium.html'
  # 渲染层依赖已由 Vite 打包进渲染层 bundle，源码不 import，整包进 asar 属死重：
  # 剔除后可显著减小体积（mermaid ~81MB / @excalidraw ~46MB / katex ~4MB / @tiptap ~1MB）
  - '!node_modules/@excalidraw/**'
  - '!node_modules/mermaid/**'
  - '!node_modules/katex/**'
  - '!node_modules/@tiptap/**'
# 原生 .node 必须解压到磁盘（无法从 asar 内加载 process.dlopen）
# electron-builder 默认会 unpack *.node，显式声明确保跨平台稳定
asarUnpack:
  - node_modules/better-sqlite3/build/Release/*.node
  # 仅解包 Windows 平台的原生模块
  - node_modules/uiohook-napi/prebuilds/win32-*/**/*.node
  - node_modules/uiohook-napi/build/Release/*.node
# 打包后钩子：删除 Chromium 自带的 LICENSES.chromium.html 等大文件
afterPack: scripts/after-pack.cjs
# 便携模式标记文件：放置到 exe 同级目录
extraFiles:
  - from: resources/portable.txt
    to: portable.txt
win:
  target:
    - target: dir
      arch:
        - x64
  icon: resources/icons/icon.ico
  # 仅保留中文 locales + en-US 兜底，删除其余语言 pak 文件（节省约 5MB）
  # 注意：Chromium locale pak 文件名用连字符（zh-CN.pak / zh-TW.pak / en-US.pak）
  # 不能用下划线（zh_CN），否则匹配不到任何 pak，locales 目录为空，启动后白屏
  electronLanguages:
    - zh-CN
    - zh-TW
    - en-US
# 便携版不生成安装包，仅输出目录，用户可自行压缩为 zip
