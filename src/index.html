<!doctype html>
<html lang="zh-CN" data-theme="light" data-name="app.html">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function(){
        try {
          var html = document.documentElement;
          var v = localStorage.getItem('sidekick-ui-version');
          var isOxy = v !== 'classic';
          html.setAttribute('data-ui-version', isOxy ? 'oxy' : 'classic');

          // 主题：Oxy 强制亮色；经典版尊重用户选择
          if (isOxy) {
            html.classList.remove('dark');
            html.setAttribute('data-theme','light');
            html.setAttribute('data-oxy','true');
          } else {
            var t = localStorage.getItem('ai-window-theme') || 'light';
            var resolved;
            if (t === 'dark') { resolved = 'dark'; }
            else if (t === 'system') {
              resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            } else { resolved = 'light'; }
            if (resolved === 'dark') { html.classList.add('dark'); html.setAttribute('data-theme','dark'); }
            else { html.classList.remove('dark'); html.setAttribute('data-theme','light'); }
          }

          // UI 比例：Oxy 根据屏幕分辨率自动计算（三档：compact/standard/spacious）；经典版读取用户手动选择
          if (isOxy) {
            var sh = window.screen.height;
            var oxyScale = sh <= 1080 ? 'compact' : sh <= 1440 ? 'standard' : 'spacious';
            html.setAttribute('data-oxy-scale', oxyScale);
            // 注意：Oxy 模式下不设置 data-ui-scale，避免 scale.css 静态值覆盖 JS 注入的变量

            // 防闪烁：恢复上次激活 app 的主题色
            var savedColor = localStorage.getItem('sidekick-active-app-color');
            if (savedColor) {
              // 简易注入：仅设置 --primary 和 --brand-500，完整色阶由 JS 引擎在 React 加载后注入
              html.style.setProperty('--primary', savedColor);
              html.style.setProperty('--brand-500', savedColor);
            }
          } else {
            var scale = localStorage.getItem('sidekick-user-ui-scale') || 'medium';
            html.setAttribute('data-ui-scale', scale);
          }
        } catch(e){}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://esm.sh; img-src 'self' data: blob: https: whiteboard-asset: notes-asset:; connect-src 'self' data: https://esm.sh whiteboard-asset: notes-asset:" />
    <title>工百窗</title>
    <!-- 字体：Orbitron(标题) + Exo 2(正文) + JetBrains Mono(代码) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Exo+2:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body data-name="app.body">
    <div id="root" data-name="app.root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
