[workspace]

[package]
name = "sidekickai-installer"
version = "1.1.0"
description = "SidekickAI maintenance wizard with signed native ZIP payloads"
authors = ["LinCi853"]
edition = "2021"

[lib]
name = "sidekickai_installer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
native-ui-acceptance = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
sidekickai-uninstall-core = { path = "../../installer-shared/uninstall-core" }
sidekickai-uninstall-host = { path = "../../installer-shared/uninstall-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Typed registry access: localized `reg.exe` output parsing cannot distinguish
# "absent" from real errors and mangles non-ASCII paths under some code pages.
winreg = "0.55"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Storage_StructuredStorage",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
