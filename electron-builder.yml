appId: com.sidekickai.app
productName: SidekickAI
# better-sqlite3 / uiohook-napi 均为 N-API 预编译（prebuilds/），按目标架构自动选取。
# 默认 npmRebuild 会在 x64 机上为 arm64 走 node-gyp 交叉编译，需要完整 ARM64 MSVC 工具集，
# 本机 VS18 仅有 Win32/x64 平台时会 MSB8020 失败。关闭重建后直接打包预编译产物。
npmRebuild: false
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - resources/icons/*
  # 包含全部 node_modules（electron-builder 自动排除 devDependencies）
  - node_modules/**/*
  # ===== 排除不需要的依赖 =====
  - '!LICENSES.chromium.html'
  # 画板/渲染层大依赖：代码已由 vite 打包进渲染层 chunk，原始包不进 asar（瘦身约 140MB）
  - '!node_modules/@excalidraw/**'
  - '!node_modules/mermaid/**'
  - '!node_modules/katex/**'
  # 渲染层依赖（Vite 已打包进渲染层 bundle，主进程从不 require），整包进 asar 属死重
  - '!node_modules/@tiptap/**'
# electron-store 已迁入 SQLite settings.db
  - '!node_modules/electron-store/**'
  # 仅保留 Windows 平台原生模块预编译
  - '!node_modules/uiohook-napi/prebuilds/darwin*/**'
  - '!node_modules/uiohook-napi/prebuilds/linux*/**'
  # better-sqlite3 的 prebuilds 是平铺文件（darwin-x64.node 等），
  # Windows 包只需 win32-*.node，排除其余平台可省约 13MB（解包后）
  - '!node_modules/better-sqlite3/prebuilds/darwin*'
  - '!node_modules/better-sqlite3/prebuilds/linux*'
# 原生 .node 必须解压到磁盘（无法从 asar 内加载 process.dlopen）
# electron-builder 默认会 unpack *.node，显式声明确保跨平台稳定
asarUnpack:
  # N-API 预编译：运行时按 process.platform/arch 选取（x64/arm64 通用）
  - node_modules/better-sqlite3/prebuilds/*.node
  # 仅解包 Windows 平台的原生模块
  - node_modules/uiohook-napi/prebuilds/win32-*/**/*.node
  # 本地 electron-rebuild 产出（开发机 x64）；运行时 prebuilds 优先
  - node_modules/better-sqlite3/build/Release/*.node
  - node_modules/uiohook-napi/build/Release/*.node
# 打包后钩子：删除 Chromium 自带的 LICENSES.chromium.html 等大文件
afterPack: scripts/after-pack.cjs
extraResources:
  - from: build/License.txt
    to: License.txt
# Windows 代码签名：从环境变量读取，未配置则跳过签名
# CSC_LINK：证书 .pfx 路径或 base64；CSC_KEY_PASSWORD：证书密码
# 架构由命令行 --x64 / --arm64 参数控制（yml 不配置 arch 避免追加导致合并包）
win:
  # dir 目标仅产出 win-unpacked / win-arm64-unpacked 目录，
  # 作为 Tauri 安装器（scripts/build-tauri-installer.cjs）的 7z 载荷源
  target:
    - target: dir
  icon: resources/icons/icon.ico
  # 仅保留中文 locales + en-US 兜底，删除其余语言 pak 文件（节省约 5MB）
  # 注意：Chromium locale pak 文件名用连字符（zh-CN.pak / zh-TW.pak / en-US.pak）
  # 不能用下划线（zh_CN），否则匹配不到任何 pak，locales 目录为空，启动后白屏
  electronLanguages:
    - zh-CN
    - zh-TW
    - en-US
