[package]
name = "sidekickai-uninstall-core"
version = "0.1.0"
edition = "2021"
description = "Shared safe protocol and execution core for SidekickAI uninstallers"
license = "MIT"
publish = false

[workspace]

[lib]
name = "sidekickai_uninstall_core"
path = "src/lib.rs"

[dependencies]
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
time = { version = "0.3", features = ["parsing"] }
aes-gcm = "0.10"
aes = "0.8"
ghash = "0.5"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
] }

[dev-dependencies]
